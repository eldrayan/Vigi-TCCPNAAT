name: Issue Dependency Checker

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]

permissions:
  issues: write
  contents: read

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check and Update Issue Dependencies
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Fetch all open issues in the repository
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            // Regex patterns to detect dependencies in the issue body
            // Matches: "- [ ] #12", "Depends on #12", "Depende de #12", "Blocked by #12", "Bloqueada por #12"
            const depRegex = /(?:depends\s+on|depende\s+de|blocked\s+by|bloqueada\s+por|dependências?:?|- \[[ xX]\])\s*[:\s]*#(\d+)/gi;

            for (const issue of openIssues) {
              // Ignore pull requests returned by the issues API
              if (issue.pull_request) continue;

              const body = issue.body || '';
              const matches = [...body.matchAll(depRegex)];
              const depIssueNumbers = [...new Set(matches.map(m => parseInt(m[1], 10)))];

              if (depIssueNumbers.length === 0) {
                continue;
              }

              console.log(`Checking Issue #${issue.number} which depends on: ${depIssueNumbers.join(', ')}`);

              let allResolved = true;
              const pendingDeps = [];

              for (const depNum of depIssueNumbers) {
                // Avoid self-dependency
                if (depNum === issue.number) continue;

                try {
                  const depIssue = await github.rest.issues.get({
                    owner,
                    repo,
                    issue_number: depNum
                  });

                  if (depIssue.data.state !== 'closed') {
                    allResolved = false;
                    pendingDeps.push(`#${depNum}`);
                  }
                } catch (err) {
                  console.warn(`Could not fetch dependent issue #${depNum}:`, err.message);
                }
              }

              const currentLabels = (issue.labels || []).map(l => typeof l === 'string' ? l : l.name);
              const hasBlockedLabel = currentLabels.includes('status:bloqueada');
              const hasUnblockedLabel = currentLabels.includes('status:desbloqueada');

              if (!allResolved) {
                console.log(`Issue #${issue.number} is STILL BLOCKED by: ${pendingDeps.join(', ')}`);
                if (!hasBlockedLabel) {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: issue.number,
                    labels: ['status:bloqueada']
                  });
                }
                if (hasUnblockedLabel) {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: issue.number,
                    name: 'status:desbloqueada'
                  });
                }
              } else {
                console.log(`Issue #${issue.number} has ALL dependencies resolved!`);
                if (hasBlockedLabel) {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: issue.number,
                    name: 'status:bloqueada'
                  });
                }
                if (!hasUnblockedLabel) {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: issue.number,
                    labels: ['status:desbloqueada']
                  });

                  // Post an automatic notification comment
                  const commentBody = `🎉 **Todas as dependências foram concluídas!**\n\nAs issues dependentes (${depIssueNumbers.map(n => '#' + n).join(', ')}) foram finalizadas. Esta issue está oficialmente **desbloqueada** e pronta para execução.`;
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issue.number,
                    body: commentBody
                  });
                  console.log(`Notification posted on Issue #${issue.number}`);
                }
              }
            }
