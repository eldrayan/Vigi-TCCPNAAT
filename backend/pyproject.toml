[project]
name = "vigi-backend"
version = "0.1.0"
description = "API e consumidor MQTT do backend Vigi"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite==0.21.0",
    "alembic>=1.16,<2.0",
    "fastapi==0.116.1",
    "paho-mqtt==2.1.0",
    "pydantic-settings==2.10.1",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
