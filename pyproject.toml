[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vigi-tccpnaat"
version = "0.1.0"
description = "Pipeline de coleta, treinamento e inferencia Edge AI do Vigi"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dagshub>=0.7.2",
    "dvc[s3]>=3.50,<4",
    "dvc-ssh>=4.3.0",
    "numpy>=1.26,<3",
    "paho-mqtt>=2.1,<3",
    "Pillow>=10,<13",
    "PyYAML>=6,<7",
    "ultralytics>=8.2,<9",
    "torch>=2.9,<3",
    "torchvision>=0.24,<1",
]

[project.optional-dependencies]
train = [
    "matplotlib>=3.8,<4",
]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "Pillow>=10,<13",
    "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
include = ["edge*", "model_lifecycle*"]
exclude = ["edge.tests*"]

[tool.pytest.ini_options]
testpaths = ["edge/tests", "tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cpu", marker = "(sys_platform == 'linux' and platform_machine != 'x86_64') or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cpu", marker = "(sys_platform == 'linux' and platform_machine != 'x86_64') or sys_platform == 'win32'" },
]
