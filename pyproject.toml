[build-system]
requires = ["setuptools==84.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vigi-tccpnaat"
version = "0.1.0"
description = "Pipeline de coleta, treinamento e inferencia Edge AI do Vigi"
requires-python = ">=3.11,<3.14"
dependencies = [
    "gpiozero==2.0.1.post3",
    "numpy==2.3.5",
    "paho-mqtt==2.1.0",
    "Pillow==12.3.0",
    "PyYAML==6.0.3",
    "ultralytics==8.4.146",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "dvc-ssh==4.3.0",
]

[project.optional-dependencies]
train = [
    "matplotlib==3.11.1",
]
mlops = [
    "dvc[ssh]==3.67.1",
]
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.6",
    "Pillow==12.3.0",
    "PyYAML==6.0.3",
]

[tool.setuptools.packages.find]
include = ["edge*", "model_lifecycle*"]
exclude = ["edge.tests*"]

[tool.pytest.ini_options]
testpaths = ["edge/tests", "tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
